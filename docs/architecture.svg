<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">AWS Automated Threat Detection and Response Platform</title>
<desc id="desc">EC2 Ubuntu auditd security events are collected by CloudWatch Agent, passed through CloudWatch Logs, Metric Filter, Alarm, EventBridge, Lambda and SNS email. S3 incident storage is planned.</desc>
<defs>
  <style><![CDATA[
  .title{font:700 36px Arial,sans-serif;fill:#10243b}.subtitle{font:18px Arial,sans-serif;fill:#536982}
  .section{font:700 21px Arial,sans-serif;fill:#142b43}.name{font:700 18px Arial,sans-serif;fill:#20334a}
  .label{font:15px Arial,sans-serif;fill:#334861}.tiny{font:13px Arial,sans-serif;fill:#536982}
  .mono{font:13px Consolas,monospace;fill:#273c55}.box{fill:#fff;stroke:#bdc9d9;stroke-width:2}
  .arrow{fill:none;stroke:#2a8a63;stroke-width:3;marker-end:url(#green)}
  .log{fill:none;stroke:#e97924;stroke-width:3;stroke-dasharray:10 7;marker-end:url(#orange)}
  .network{fill:none;stroke:#2466c7;stroke-width:3;marker-end:url(#blue)}
  ]]></style>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2a8a63"/></marker>
  <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e97924"/></marker>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2466c7"/></marker>
  <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#f9fcff"/><stop offset="1" stop-color="#f0f6fc"/></linearGradient>
</defs>
